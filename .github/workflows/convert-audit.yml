name: Convert audit

on:
  push:
    paths:
      - 'powershell/*.ps1'
      - 'audit_convert.py'
      - '.github/workflows/convert-audit.yml'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Convert PowerShell scripts to audit file
        run: |
          python audit_convert.py -n "Audit_File"
          grep -c "<custom_item>" audits/Audit_File.audit

      - name: Commit audit file to the repo
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add audits/Audit_File.audit
          git commit -m "Update audit file" || echo "No changes"
          git push